[project]
name = "sih2026"
version = "0.1.0"
description = "Dry bulk charter forecasting pipeline (SIH 2026)"
requires-python = ">=3.12"
dependencies = [
    "ortools>=9.15.6755",
    "polars>=1.0",
    "pydantic>=2.13.4",
    "scikit-learn>=1.9.0",
    "timesfm[torch]>=3.0.0",
    "torch>=2.4.0",
    "xgboost>=3.4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ml", "src/opt", "src/fetchers", "src/data_prep"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.4",
]

[project.scripts]
build-master = "data_prep.build_master:main"
baselines = "ml.baselines:main"
build-samples = "ml.datasets.build_samples:main"
export-models = "ml.export:main"



[tool.ruff.lint]
# Ignore minor stylistic and scratch-stage warnings
ignore = ['SIM118', 'PLR0124', 'RUF059']


[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }
